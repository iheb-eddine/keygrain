name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checksum-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vectors.json checksum
        run: |
          ACTUAL=$(sha256sum vectors.json | cut -d' ' -f1)
          EXPECTED=$(tr -d '[:space:]' < .vectors-checksum)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::vectors.json checksum mismatch"; exit 1; }
      - name: Verify SPEC.md checksum
        run: |
          ACTUAL=$(sha256sum SPEC.md | cut -d' ' -f1)
          EXPECTED=$(tr -d '[:space:]' < .spec-checksum)
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::SPEC.md checksum mismatch"; exit 1; }

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh ci/version-check.sh

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and run tests
        working-directory: python
        run: |
          pip install -e .
          pip install pytest
          python -m pytest -q --color=no | tee test-output.txt
      - name: Check test count baseline
        working-directory: python
        run: |
          # Strip any ANSI color, then read the "<n> passed" figure robustly
          # (pytest may emit color in CI; a leading-digit anchor would miss it).
          ACTUAL_COUNT=$(sed -E 's/\x1b\[[0-9;]*m//g' test-output.txt | grep -oE '[0-9]+ passed' | grep -oE '^[0-9]+' | tail -1)
          ACTUAL_COUNT=${ACTUAL_COUNT:-0}
          BASELINE=$(grep '^python=' ../.test-baselines | cut -d= -f2)
          if [ "$ACTUAL_COUNT" -lt "$BASELINE" ]; then
            echo "::error::TEST COUNT REGRESSION: python (actual: $ACTUAL_COUNT, baseline: $BASELINE)"
            exit 1
          fi
          echo "Test count OK: python $ACTUAL_COUNT >= $BASELINE"

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        working-directory: extension/tests
        run: node test.mjs | tee test-output.txt
      - name: Run popup module tests
        working-directory: extension/tests
        run: node test-popup-modules.mjs
      - name: Check test count baseline
        working-directory: extension/tests
        run: |
          ACTUAL_COUNT=$(grep -o '^[0-9]* tests:' test-output.txt | grep -o '^[0-9]*' || true)
          ACTUAL_COUNT=${ACTUAL_COUNT:-0}
          BASELINE=$(grep '^js=' ../../.test-baselines | cut -d= -f2)
          if [ "$ACTUAL_COUNT" -lt "$BASELINE" ]; then
            echo "::error::TEST COUNT REGRESSION: js (actual: $ACTUAL_COUNT, baseline: $BASELINE)"
            exit 1
          fi
          echo "Test count OK: js $ACTUAL_COUNT >= $BASELINE"

  test-js-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run slow strengthen tests
        working-directory: extension/tests
        run: node test-strengthen-slow.mjs

  test-cross-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python package
        run: pip install ./python
      - name: Run cross-platform check
        run: bash ci/cross-platform-check.sh

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension
        working-directory: extension
        run: bash build.sh
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: keygrain-chrome
          path: extension/dist/keygrain-chrome-*.zip
      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: keygrain-firefox
          path: extension/dist/keygrain-firefox-*.zip

  # VERIFY.md promises that the same commit yields byte-identical zips on any
  # machine with Info-ZIP zip 3.0. That promise is only as good as a test.
  #
  # Two real bugs shipped because nothing checked it (both fixed in eb198a6):
  #   * `touch -t` reads its argument in LOCAL time while zip ran with TZ=UTC, so
  #     the recorded timestamps moved with the builder's offset.
  #   * zip stores each entry's Unix mode in the central directory and -X does not
  #     strip it, so the builder's umask leaked (0644 on CI vs 0664 locally) —
  #     a 37-byte difference.
  # Both are invisible to a single build. Only a second build under a DIFFERENT
  # timezone and umask exposes them, which is exactly what this job does.
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the zip implementation is the pinned one
        run: |
          zip --version | head -2
          zip --version | grep -q "This is Zip 3.0" \
            || { echo "::error::not Info-ZIP zip 3.0 — VERIFY.md pins that version"; exit 1; }
      - name: Build A — UTC, umask 022
        working-directory: extension
        run: |
          umask 022
          TZ=UTC LC_ALL=C bash build.sh >/dev/null
          mkdir -p /tmp/repro-a && cp dist/keygrain-*.zip /tmp/repro-a/
      - name: Build B — Asia/Tokyo, umask 077, French locale
        working-directory: extension
        run: |
          umask 077
          TZ=Asia/Tokyo LC_ALL=C bash build.sh >/dev/null
          mkdir -p /tmp/repro-b && cp dist/keygrain-*.zip /tmp/repro-b/
      - name: Assert byte-identical
        run: |
          status=0
          for f in /tmp/repro-a/*.zip; do
            name=$(basename "$f")
            a=$(sha256sum "$f" | cut -d' ' -f1)
            b=$(sha256sum "/tmp/repro-b/$name" | cut -d' ' -f1)
            if [ "$a" = "$b" ]; then
              echo "OK        $name  $a"
            else
              echo "::error::$name is NOT reproducible across TZ/umask"
              echo "  build A (UTC, umask 022):        $a"
              echo "  build B (Tokyo, umask 077):      $b"
              # Show WHERE they differ — usually central-directory modes or DOS times.
              cmp -l "$f" "/tmp/repro-b/$name" | head -20 || true
              status=1
            fi
          done
          exit $status

  # Standing check that every shipped client version still has the public anchor
  # VERIFY.md tells users to look for. Catches the drift case that release.yml
  # cannot: a tag deleted later, a release converted back to a draft, or assets
  # removed. Extension 1.1.0 shipped with no anchor for weeks and nothing noticed.
  release-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the tag list
      - name: Every client tag has a release with checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/check-release-anchors.sh "${{ github.repository }}"

  build-mobile:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2048m"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm /tmp/cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Run unit tests
        working-directory: kotlin
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --max-workers=1
      - name: Check kotlin test count baseline
        working-directory: kotlin
        run: |
          ACTUAL_COUNT=$(find app/build/test-results/testReleaseUnitTest -name "*.xml" -exec grep -c "<testcase" {} + | awk -F: '{sum+=$NF} END {print sum}')
          ACTUAL_COUNT=${ACTUAL_COUNT:-0}
          BASELINE=$(grep '^kotlin=' ../.test-baselines | cut -d= -f2)
          if [ "$ACTUAL_COUNT" -lt "$BASELINE" ]; then
            echo "::error::TEST COUNT REGRESSION: kotlin (actual: $ACTUAL_COUNT, baseline: $BASELINE)"
            exit 1
          fi
          echo "Test count OK: kotlin $ACTUAL_COUNT >= $BASELINE"
      - name: Build release APK
        working-directory: kotlin
        run: ./gradlew assembleRelease --no-daemon --max-workers=1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keygrain-apk
          path: |
            kotlin/app/build/outputs/apk/release/app-release.apk
            kotlin/app/build/outputs/apk/release/app-release-unsigned.apk
