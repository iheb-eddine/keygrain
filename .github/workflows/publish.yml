name: Publish to PyPI

on:
  release:
    types: [published]

# Default: no permissions. The publish job opts into the minimum it needs.
permissions: {}

jobs:
  publish:
    # Only for CLI releases. Tags are per component (cli-vX.Y.Z), and the `release`
    # event cannot filter by tag, so the guard lives here. Without it, publishing a
    # firefox-* or chrome-* release would also attempt a PyPI upload — which fails
    # noisily because that version already exists on PyPI.
    if: startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # REQUIRED: mint the OIDC token for PyPI Trusted Publishing
      contents: read    # checkout
    steps:
      # Belt-and-braces, and deliberately the FIRST step so nothing is checked out
      # or built before the tag is vetted.
      #
      # The job-level `if` above is the primary guard, but it is not sufficient on
      # its own: a `release` event runs each workflow file AS IT EXISTS AT THE
      # TAGGED COMMIT, not as it exists on main. So when a store finally ships a
      # build from an older commit and you tag it, the workflow that runs is the
      # one from back then — guard included, or not. (Cutting chrome-v1.2.0 at
      # 55a8934 on 2026-07-30 hit exactly this; the workflow had to be disabled by
      # hand for the duration.) This step cannot fix an old tag either, but it does
      # fail closed if the `if:` is ever edited, inverted, or sidestepped by a new
      # trigger, and it states the reason in the log instead of silently uploading.
      - name: Refuse to publish unless this is a CLI release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            cli-v*)
              echo "Tag '$TAG' is a CLI release — proceeding to PyPI." ;;
            *)
              echo "::error::Refusing to publish to PyPI: tag '$TAG' is not 'cli-v*'."
              echo "Component tags are chrome-v*, firefox-v*, android-v*, cli-v*."
              echo "Legacy 'vX.Y.Z' tags are also refused on purpose — CLI 1.0.0"
              echo "shipped from v1.0.0 and must not be re-published."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Reproducible wheels: pin zip entry timestamps to the released commit's
      # timestamp so anyone rebuilding from this tag gets a byte-identical wheel.
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build distribution
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        working-directory: python
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # Trusted Publishing (OIDC) + PEP 740 attestations.
      # No token/secret: PyPI validates the OIDC identity against the registered
      # publisher (owner=iheb-eddine, repo=keygrain, workflow=publish.yml).
      # Attestations are generated by default and cryptographically bind the
      # uploaded artifacts to this workflow run and commit.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
